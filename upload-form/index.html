<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LectureLens Upload</title>
  <style>
    :root { --bg: #f7f3ea; --card: #fffdf8; --ink: #24231f; --muted: #6b675d; --accent: #5b6b3a; --line: #ddd6c6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    form { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 28px; display: grid; gap: 20px; }
    h1 { margin: 0; font-size: 1.4rem; }
    p.hint { margin: -12px 0 0; color: var(--muted); font-size: .9rem; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input[type=file] { font: inherit; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; background: #fff; }
    button { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <!-- TODO: replace the placeholder action URL with the real endpoint. -->
  <form action="https://example.com/upload" method="post" enctype="multipart/form-data">
    <h1>Upload lesson files</h1>
    <p class="hint">Add your recording and your notes, then submit.</p>

    <label>
      Video
      <input type="file" name="video" accept="video/*" required>
    </label>

    <label>
      PDF
      <input type="file" name="pdf" accept="application/pdf,.pdf" required>
    </label>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
