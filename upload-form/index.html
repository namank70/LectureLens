<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LectureLens Upload</title>
  <style>
    :root { --bg: #f7f3ea; --card: #fffdf8; --ink: #24231f; --muted: #6b675d; --accent: #5b6b3a;
            --line: #ddd6c6; --ok: #2f6b3a; --err: #a33a2a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    form { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 28px; display: grid; gap: 20px; }
    h1 { margin: 0; font-size: 1.4rem; }
    p.hint { margin: -12px 0 0; color: var(--muted); font-size: .9rem; }
    label { display: grid; gap: 6px; font-weight: 600; }
    label small { font-weight: 400; color: var(--muted); }
    input[type=file] { font: inherit; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; background: #fff; }
    button { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    progress { width: 100%; height: 10px; }
    #status { margin: 0; font-size: .95rem; min-height: 1.5em; overflow-wrap: anywhere; }
    #status.ok { color: var(--ok); } #status.err { color: var(--err); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <form id="upload-form" novalidate>
    <h1>Upload lesson files</h1>
    <p class="hint">Add your recording and your notes, then submit. The lesson is queued once both files are uploaded.</p>

    <label>
      Video <small>MP4 only</small>
      <input type="file" id="video" name="video" accept="video/mp4,.mp4" required>
    </label>

    <label>
      Notes <small>PDF only</small>
      <input type="file" id="pdf" name="pdf" accept="application/pdf,.pdf" required>
    </label>

    <button type="submit" id="submit">Submit</button>
    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="status" role="status" aria-live="polite"></p>
  </form>

  <script>
    // Upload API (backend team, AWS us-east-2). If calls fail to resolve, check the stack's ApiUrl output.
    const API = "https://ugm369dj9a.execute-api.us-east-2.amazonaws.com";

    const form = document.getElementById("upload-form");
    const videoInput = document.getElementById("video");
    const pdfInput = document.getElementById("pdf");
    const button = document.getElementById("submit");
    const bar = document.getElementById("progress");
    const statusEl = document.getElementById("status");

    function setStatus(text, kind = "") { statusEl.textContent = text; statusEl.className = kind; }

    // Steps 1 and 3: ask the API for a pre-signed S3 upload link.
    async function getUploadLink(path) {
      const res = await fetch(API + path, { method: "POST" });
      if (!res.ok) throw new Error(`Could not get an upload link (${res.status}).`);
      return res.json();
    }

    // Steps 2 and 4: PUT the raw file (not FormData) with the exact Content-Type the link was signed for.
    // XMLHttpRequest is used instead of fetch so we can show upload progress for large videos.
    function putFile(url, file, contentType, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", url);
        xhr.setRequestHeader("Content-Type", contentType);
        xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
        xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve()
          : reject(new Error(xhr.status === 403
              ? "Upload refused (403). The link may have expired; please try again."
              : `Upload failed (${xhr.status}).`));
        xhr.onerror = () => reject(new Error("Network error during upload."));
        xhr.send(file);
      });
    }

    function isMp4(f) { return f.type === "video/mp4" || /\.mp4$/i.test(f.name); }
    function isPdf(f) { return f.type === "application/pdf" || /\.pdf$/i.test(f.name); }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const video = videoInput.files[0];
      const pdf = pdfInput.files[0];
      if (!video || !pdf) return setStatus("Please choose both a video and a PDF.", "err");
      if (!isMp4(video)) return setStatus("The video must be an MP4 file.", "err");
      if (!isPdf(pdf)) return setStatus("The notes must be a PDF file.", "err");

      button.disabled = true;
      bar.hidden = false; bar.value = 0;
      // Video counts for 90% of the bar, the PDF for the last 10%.
      const weight = { video: 90, pdf: 10 };
      try {
        setStatus("Preparing video upload…");
        const v = await getUploadLink("/uploads/video");

        setStatus("Uploading video…");
        await putFile(v.upload_url, video, v.content_type || "video/mp4",
          (p) => { bar.value = p * weight.video; });

        // New link requested only now, so it can't expire while the video uploads.
        setStatus("Preparing notes upload…");
        const n = await getUploadLink(`/uploads/notes?job_id=${encodeURIComponent(v.job_id)}`);

        setStatus("Uploading notes…");
        await putFile(n.upload_url, pdf, n.content_type || "application/pdf",
          (p) => { bar.value = weight.video + p * weight.pdf; });

        bar.value = 100;
        setStatus(`Done! Your lesson is queued. Job ID: ${v.job_id}`, "ok");
        form.reset();
      } catch (err) {
        setStatus(err.message || "Something went wrong. Please try again.", "err");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
